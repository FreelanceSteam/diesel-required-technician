<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diesel Required</title>
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-title" content="Diesel Required">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="technician-icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="technician-icon-192.png?v=3">
<link rel="manifest" href="manifest.json?v=4">
<style>
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:linear-gradient(180deg,#eef5ff,#ffffff); color:#0b2545;
}
.card {
  width:min(92vw,420px); text-align:center; background:#fff; border-radius:28px;
  padding:34px 24px 30px; box-shadow:0 18px 50px rgba(11,61,145,.16);
}
.icon { width:128px; height:128px; border-radius:28px; display:block; margin:0 auto 20px;
  box-shadow:0 10px 25px rgba(0,0,0,.14); }
h1 { margin:0 0 8px; font-size:27px; }
p { margin:0 0 24px; color:#667085; }
button {
  width:100%; border:0; border-radius:14px; padding:15px 18px; font-size:17px;
  font-weight:700; color:#fff; background:#0b3d91; cursor:pointer;
}
.small { margin-top:15px; font-size:12px; color:#98a2b3; }
.status { margin-top:12px; font-size:13px; color:#667085; min-height:18px; }
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="technician-icon-512.png?v=3" alt="Diesel Required Technician">
  <h1>Diesel Required</h1>
  <p>Technician Mobile App</p>
  <button onclick="openTechnician()">Open Technician App</button>
  <div id="status" class="status"></div>
  <div class="small">Diesel Requirement System</div>
</main>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZGnmIstiDKRoy2u19OwZMGXC0t_W6T8CnR1qO26FlbSEY3WhqDp8Sj3oU_aaWi-jGaA/exec";

function getToken() {

  const queryToken =
    new URLSearchParams(window.location.search).get("token");

  if (queryToken) {
    localStorage.setItem("dieselTechnicianToken", queryToken);
    return queryToken;
  }

  const hash = window.location.hash || "";

  if (hash) {
    const params =
      new URLSearchParams(hash.substring(1));

    const hashToken = params.get("token");

    if (hashToken) {
      localStorage.setItem("dieselTechnicianToken", hashToken);
      return hashToken;
    }
  }

  return localStorage.getItem("dieselTechnicianToken") || "";
}

function openTechnician() {
  const token = getToken();

  if (!token) {
    document.getElementById("status").innerText =
      "Technician token missing. Please use your assigned link.";
    return;
  }

  window.location.href =
    APPS_SCRIPT_URL + "#token=" + encodeURIComponent(token);
}
</script>
</body>
</html>
