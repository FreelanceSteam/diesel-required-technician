<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diesel Required">
<title>Diesel Required</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:linear-gradient(160deg,#0b3d91,#06285f);color:#fff;padding:24px}
.card{width:min(430px,100%);text-align:center;background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.20);border-radius:28px;padding:32px 24px;
backdrop-filter:blur(12px)}
.logo{width:110px;height:110px;border-radius:24px;object-fit:cover;margin-bottom:18px;
box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{margin:0 0 8px;font-size:25px}
p{margin:0 0 24px;opacity:.9;line-height:1.5}
.btn{display:block;width:100%;padding:15px 18px;border:0;border-radius:14px;
background:#ffd400;color:#102a43;font-size:17px;font-weight:800;text-decoration:none}
.note{margin-top:18px;font-size:12px;opacity:.7}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="apple-touch-icon.png" alt="Diesel Required">
<h1>Diesel Required</h1>
<p>Technician App</p>
<a id="openBtn" class="btn" href="#">Open Technician App</a>
<div class="note">Tap the button to open your assigned technician form.</div>
</main>
<script>
(function(){
  const hash = window.location.hash || "";
  const target = "https://script.google.com/macros/s/AKfycbxZGnmIstiDKRoy2u19OwZMGXC0t_W6T8CnR1qO26FlbSEY3WhqDp8Sj3oU_aaWi-jGaA/exec" + hash;
  document.getElementById("openBtn").href = target;
})();
</script>
</body>
</html>
